# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: funkymaker-transfer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: Transfer__MaxUploadMegabytes
        value: "250"
      - key: Transfer__StallTimeoutSeconds
        value: "300"
      - key: Transfer__DownloadCompletionGraceSeconds
        value: "600"
      # Highest player limit hosts can set for a room (2-32)
      - key: Transfer__MaxRoomMembers
        value: "16"
      # Test-build gate: set to "false" to close testing (test builds then refuse to start)
      - key: Testing__Open
        value: "true"
      - key: Testing__Message
        value: ""
